[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-platform"
version = "0.1.0"
description = "Versioned motion-capture recovery and evaluation platform"
requires-python = ">=3.10"

[project.scripts]
mocap-platform = "mocap_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
